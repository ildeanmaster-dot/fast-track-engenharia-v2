[project]
name = "camara-pipeline"
version = "0.1.0"
description = "Pipeline de dados da Camara dos Deputados - Upskill Tiller T2"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
